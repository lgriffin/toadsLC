name: release

# Push a tag like v0.2.1 to publish ToadsLC-0.2.1.zip on the repo's Releases page. The tag
# sets the version: it is stamped into the zipped ToadsLC.toc, whatever the repo's copy says.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the release zip
        run: python3 tools/package.py --version "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/ToadsLC-*.zip --title "Toads LC $GITHUB_REF_NAME" --generate-notes
