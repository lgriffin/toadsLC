name: release

# Push a tag named after the .toc's version (v0.1.0 for "## Version: 0.1.0") to publish
# ToadsLC-<version>.zip on the repo's Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the .toc version
        run: |
          version=$(sed -n 's/^## Version: *//p' ToadsLC/ToadsLC.toc | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match ## Version: $version in ToadsLC.toc"
            exit 1
          fi
      - name: Build the release zip
        run: python3 tools/package.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/ToadsLC-*.zip --title "Toads LC $GITHUB_REF_NAME" --generate-notes
